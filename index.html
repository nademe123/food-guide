<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
const lang = navigator.language;

if (lang.startsWith('ko')) location.href='kr.html';
else if (lang.startsWith('en')) location.href='en.html';
else if (lang.startsWith('zh')) location.href='cn.html';
else if (lang.startsWith('vi')) location.href='vn.html';
else location.href='kr.html';
</script>
</head>
<body>
<p>Loading...</p>
</body>
</html>
